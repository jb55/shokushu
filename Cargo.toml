[package]
name = "shokushu"
version = "0.1.0"
edition = "2024"
description = "Reads timecode from a Tentacle Sync E: over Bluetooth LE without pairing, or as SMPTE LTC from an audio input"
license = "MIT"
repository = "https://github.com/jb55/shokushu"

[features]
# Nothing on. A `cargo add shokushu` gets the decoders and no dependencies at
# all — reading an advertisement shouldn't compile a Bluetooth stack, let alone
# an audio one. The cost lands on this repo instead: the binaries declare their
# `required-features`, so building or running one here names them
# (`cargo run --features scan,cli --bin shokushu-ble`).
default = []

# The Bluetooth transport: `ble::Scanner`, `ble::Device`, `ble::diagnostics`.
# Parsing an advertisement needs none of it — `ble::parse` is always available.
scan = ["dep:btleplug", "dep:futures", "dep:tokio", "dep:uuid", "dep:thiserror"]

# The audio input the `shokushu` binary decodes LTC from. There is no library
# transport for it yet, so this is the binary's dependency and nothing else's;
# `ltc::LtcDecoder` is always available and takes samples from wherever you got
# them.
audio = ["dep:cpal"]

# What the binaries need to be binaries.
cli = ["dep:clap", "dep:anyhow"]

[dependencies]
anyhow = { version = "1.0.104", optional = true }
btleplug = { version = "0.13", optional = true }
clap = { version = "4.6.6", features = ["derive"], optional = true }
cpal = { version = "0.18", optional = true }
futures = { version = "0.3.34", optional = true }
thiserror = { version = "2.0", optional = true }
tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "macros",
    "time",
], optional = true }
uuid = { version = "1.26.0", optional = true }

[[bin]]
name = "shokushu"
path = "src/main.rs"
required-features = ["audio", "cli"]

[[bin]]
name = "shokushu-ble"
path = "src/bin/shokushu-ble.rs"
required-features = ["scan", "cli"]

[[bin]]
name = "shokushu-probe"
path = "src/bin/shokushu-probe.rs"
required-features = ["scan", "cli"]

[[bin]]
name = "shokushu-gatt"
path = "src/bin/shokushu-gatt.rs"
required-features = ["scan", "cli"]

[[example]]
name = "scan"
required-features = ["scan"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
